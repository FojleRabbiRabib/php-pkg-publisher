[project]
name = "php-pkg-publisher"
version = "0.0.0"
description = "Signed APT and RPM repository platform for PHP extensions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=5.4"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PTH", "RUF", "S", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["tools", "tests/unit", "tests/negative", "tests/container"]
files = ["publisher", "tools", "tests"]

[tool.pytest.ini_options]
pythonpath = [".", "tools", "tests/unit", "tests/negative", "tests/container"]
testpaths = ["tests"]
addopts = "-m 'not container'"
markers = ["container: installs with a real apt or dnf in docker; run with `pytest -m container`"]
