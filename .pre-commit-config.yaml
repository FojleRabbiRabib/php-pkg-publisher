# Every hook runs a tool from the hash-pinned development environment (requirements-dev.txt),
# so local checks and CI use one set of versions. Activate that environment before committing.
minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: unsupported
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: unsupported
        types: [python]
      - id: mypy
        name: mypy
        entry: mypy
        language: unsupported
        types: [python]
        pass_filenames: false
      - id: lint-pins
        name: pin lint
        entry: python tools/lint_pins.py
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: phpcs
        name: phpcs
        entry: vendor/bin/phpcs
        language: unsupported
        types: [php]
        pass_filenames: false
      - id: phpstan
        name: phpstan
        entry: vendor/bin/phpstan analyse --no-progress
        language: unsupported
        types: [php]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: pytest -q
        language: unsupported
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: check-added-large-files
        name: check for large files
        entry: check-added-large-files --maxkb=500
        language: unsupported
      - id: check-case-conflict
        name: check for case conflicts
        entry: check-case-conflict
        language: unsupported
      - id: check-merge-conflict
        name: check for merge conflict markers
        entry: check-merge-conflict
        language: unsupported
        types: [text]
      - id: check-toml
        name: check toml
        entry: check-toml
        language: unsupported
        types: [toml]
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: unsupported
        types: [yaml]
      - id: detect-private-key
        name: detect private keys
        entry: detect-private-key
        language: unsupported
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: unsupported
        types: [text]
        exclude: ^tests/fixtures/sigstore/
      - id: mixed-line-ending
        name: fix mixed line endings
        entry: mixed-line-ending --fix=lf
        language: unsupported
        types: [text]
        exclude: ^tests/fixtures/sigstore/
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer --markdown-linebreak-ext=md
        language: unsupported
        types: [text]
        exclude: ^tests/fixtures/sigstore/
