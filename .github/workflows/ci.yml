name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:2.11.1@sha256:6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c
          coverage: none
      - name: Install PHP tools
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
      - name: Pin lint
        run: python tools/lint_pins.py
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: PHP receiver
        run: |
          php -l web/hooks/sync.php
          vendor/bin/phpcs
          vendor/bin/phpstan analyse --no-progress
      - name: Unit and negative tests
        run: pytest -q
      - name: Pre-commit hooks
        run: pre-commit run --all-files

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Pull the pinned images
        run: grep -o '[a-z]*@sha256:[0-9a-f]*' tests/container/images.py | xargs -n1 docker pull -q
      - name: Container tests
        run: pytest -m container -q
