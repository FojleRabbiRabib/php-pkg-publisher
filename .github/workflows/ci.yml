name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # the release workflow runs the same gates before it makes a release
  workflow_call:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer:2.11.1@sha256:6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c
          coverage: none
      - name: Install PHP tools
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist
      - name: Pin lint
        run: python tools/lint_pins.py
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: PHP receiver
        run: |
          php -l web/sync.php
          vendor/bin/phpcs
          vendor/bin/phpstan analyse --no-progress
      - name: Shell
        run: shellcheck setup.sh
      - name: Unit and negative tests
        run: pytest -q
      - name: Pre-commit hooks
        run: pre-commit run --all-files

  # One job per image and per runner architecture, each pulling only its own image. The arm64
  # runner is a native one, so the apt and dnf clients on it are arm64 and aarch64 ones.
  # "rest" runs any container test that is not tied to an image, so a test added without an image
  # name is not skipped. Neither "rest" nor the deploy host test (in the Ubuntu 22.04 job) tests a
  # client, so the arm64 runner runs neither of them.
  container-image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        exclude:
          - image: rest
            runner: ubuntu-24.04-arm
        image:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04
          - debian-bookworm
          - debian-trixie
          - almalinux-8
          - almalinux-9
          - almalinux-10
          - fedora-44
          - rest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Pull the pinned image
        if: matrix.image != 'rest'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          python -c "import sys; sys.path.insert(0, 'tests/container'); from images import IMAGES; print(IMAGES[sys.argv[1]].reference)" "$IMAGE" \
            | xargs docker pull -q
      - name: Container tests
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ "$IMAGE" = rest ]; then
            # exit status 5 means that no test is left over, which is the expected case
            pytest -m container -q -k 'not (ubuntu-22.04 or ubuntu-24.04 or ubuntu-26.04 or debian-bookworm or debian-trixie or almalinux-8 or almalinux-9 or almalinux-10 or fedora-44)' || [ "$?" -eq 5 ]
          elif [ "$RUNNER_ARCH" = ARM64 ]; then
            # the deploy host test checks the deploy script, not a client, so only amd64 runs it
            pytest -m container -q --ignore=tests/container/test_deploy_host.py -k "$IMAGE"
          else
            pytest -m container -q -k "$IMAGE"
          fi

  # The one check that branch protection names: it passes only when every image job passed.
  container:
    if: always()
    needs: container-image
    runs-on: ubuntu-24.04
    steps:
      - name: Every container job passed
        env:
          RESULT: ${{ needs.container-image.result }}
        run: test "$RESULT" = success
