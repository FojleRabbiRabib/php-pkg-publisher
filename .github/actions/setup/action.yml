name: Set up the test environment
description: Python 3.10 with the hash-pinned development tools, and the verification tools the tests run.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.10"
    - name: Install development tools
      shell: bash
      run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
    - name: Install verification tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          apt-utils createrepo-c dpkg-dev gnupg gpgv rpm
        curl --fail --silent --show-error --location --output "$RUNNER_TEMP/cosign" \
          https://github.com/sigstore/cosign/releases/download/v3.1.1/cosign-linux-amd64
        echo "ae1ecd212663f3693ad9edf8b1a183900c9a52d3155ba6e354237f9a0f6463fc  $RUNNER_TEMP/cosign" \
          | sha256sum --check --strict
        sudo install --mode 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
